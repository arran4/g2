<h2>{{.Title}}</h2>
{{if .HasMultipleNewsRepos}}
<p class="news-scope-nav"><a href="{{.BaseURL}}news/">All news</a> | <a href="{{.BaseURL}}news/archive/">All news archive</a></p>
{{end}}

<div class="news-archive">
    <ul>
        {{range .GlobalNews}}
        <li>
            <a href="{{.ArchivePath}}/">{{.Title}}</a> - {{.Posted.Format "2006-01-02"}}{{if .RepoName}} (<a href="{{$.BaseURL}}repos/{{.RepoName}}/news/archive/">{{.RepoName}}</a>){{end}}
        </li>
        {{end}}
        {{range .News}}
        <li>
            <a href="{{.DirName}}/">{{.Title}}</a> - {{.Posted.Format "2006-01-02"}}
        </li>
        {{end}}
    </ul>
</div>
